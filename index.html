<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Meteo Reale - XHR</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">
    <header class="app-header">
      <h1>🌤️ Dashboard Meteo Reale</h1>
      <p class="subtitle">Dati meteo live tramite l'API pubblica Open-Meteo e <code>XMLHttpRequest</code></p>
    </header>

    <main>
      <section class="controls-section">
        <form id="searchForm" class="search-bar">
          <input 
            type="text" 
            id="cityInput" 
            placeholder="Inserisci il nome di una città (es. Roma, Milano, Parigi)..." 
            autocomplete="off"
            required
          >
          <button type="submit" id="btnSearch" class="btn btn-primary">Cerca Meteo</button>
        </form>
      </section>

      <section class="feedback-section">
        <div id="spinner" class="spinner hidden" aria-hidden="true"></div>
        <div id="statusMessage" class="status-message hidden" role="alert"></div>
      </section>

      <section class="results-section">
        <div id="weatherCard" class="weather-card hidden">
          <div class="card-header">
            <h2 id="cityName">--</h2>
            <span id="countryBadge" class="badge">--</span>
          </div>
          <div class="card-body">
            <div class="main-temp">
              <span id="temperature">--</span><span class="unit">°C</span>
            </div>
            <div class="weather-details">
              <p><strong>Condizioni:</strong> <span id="weatherCondition">--</span></p>
              <p><strong>Vento:</strong> <span id="windSpeed">--</span> km/h</p>
              <p><strong>Coordinate:</strong> <span id="coordinates">--</span></p>
              <p><strong>Ultimo aggiornamento:</strong> <span id="lastUpdated">--</span></p>
            </div>
          </div>
        </div>
      </section>
    </main>

    <footer class="app-footer">
      <p>Progetto AJAX per Esercitazione — Fonte Dati: Open-Meteo.com API</p>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>

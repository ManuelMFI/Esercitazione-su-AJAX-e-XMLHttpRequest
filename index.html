<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Meteo - XHR</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>Dashboard Meteo</h1>
    <p class="sottotitolo">Ricerca meteo in tempo reale con XMLHttpRequest</p>

    <div class="ricerca">
      <input type="text" id="inputCitta" placeholder="Inserisci una città (es. Roma, Milano)...">
      <button id="btnCerca">Cerca</button>
    </div>

    <div id="loading" class="nascosto">Caricamento in corso...</div>
    <div id="errore" class="box-errore nascosto"></div>

    <div id="schedaMeteo" class="scheda nascosto">
      <div class="scheda-header">
        <h2 id="nomeCitta"></h2>
        <span id="paese"></span>
      </div>
      <div class="temperatura">
        <span id="temp"></span> °C
      </div>
      <ul class="dettagli">
        <li><strong>Condizioni:</strong> <span id="condizioni"></span></li>
        <li><strong>Vento:</strong> <span id="vento"></span> km/h</li>
        <li><strong>Coordinate:</strong> <span id="coordinate"></span></li>
        <li><strong>Rilevamento:</strong> <span id="orario"></span></li>
      </ul>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
